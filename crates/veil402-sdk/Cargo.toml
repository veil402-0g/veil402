[package]
name = "veil402-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Canonical Veil client library"

[dependencies]
acvm = { git = "https://github.com/noir-lang/noir", rev = "c57152f91260ecdb9faad4efc20abb14b6d2ece7", features = ["bn254"] }
alloy = { version = "1", features = ["sol-types", "contract", "signers"] }
ark-bn254 = "0.5"
ark-ff = "0.5"
borsh = { version = "1", features = ["derive"] }
bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir", rev = "c57152f91260ecdb9faad4efc20abb14b6d2ece7" }
futures-util = "0.3"
hex = "0.4"
hpke = "0.15"
light-poseidon = "0.3"
nargo = { git = "https://github.com/noir-lang/noir", rev = "c57152f91260ecdb9faad4efc20abb14b6d2ece7" }
noirc_abi = { git = "https://github.com/noir-lang/noir", rev = "c57152f91260ecdb9faad4efc20abb14b6d2ece7" }
noirc_artifacts = { git = "https://github.com/noir-lang/noir", rev = "c57152f91260ecdb9faad4efc20abb14b6d2ece7" }
process-wrap = { version = "8.2.1", default-features = false, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }
prost = "0.14.4"
rand = "0.8"
rs-merkle-tree = { version = "0.1", default-features = false, features = ["memory_store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
ark-bn254 = "0.5"
light-poseidon = "0.3"
veil402-enclave = { path = "../veil402-enclave" }
alloy = { version = "1", features = ["sol-types", "contract", "provider-http", "signer-local", "network"] }
serde_json = "1"
serial_test = "3"
tempfile = "3"

[lints]
workspace = true
