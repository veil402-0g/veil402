[package]
name = "veil402-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Self-hosted Veil gateway: index, wallet, sessions"

[dependencies]
alloy = { version = "1", features = ["contract", "provider-http", "sol-types", "rpc-types-eth"] }
async-trait = "0.1"
dotenvy = "0.15"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
veil402-sdk = { path = "../veil402-sdk" }
walletkit-rs = { git = "https://github.com/21r21a33333/walletkit", rev = "5af8b6ab3b9bc655c95dd8bc5d7655bce86e3cfe" }

[dev-dependencies]
alloy = { version = "1", features = ["network", "signer-local"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
